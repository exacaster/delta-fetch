name: Build Java
on:
  workflow_call: { }

jobs:
  build-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'adopt'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Build with Gradle
        run: ./gradlew build dockerfile
      - uses: actions/upload-artifact@v4
        with:
          name: docker-artifacts
          path: ./build/docker/main/
