plugins {
    id "groovy"
    id "io.micronaut.application" version "3.7.10"
    id "com.github.ben-manes.versions" version "0.51.0"
}

group "com.exacaster.deltafetch"
version "1.0-SNAPSHOT"

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
}

micronaut {
    version = "3.8.3"
    runtime "netty"
}
mainClassName = "com.exacaster.deltafetch.Application"

dependencies {
    // Micronaut
    implementation "io.micronaut.cache:micronaut-cache-caffeine"
    implementation "io.micronaut.security:micronaut-security-oauth2"
    implementation "io.micronaut.security:micronaut-security-jwt"
    implementation "io.micronaut.reactor:micronaut-reactor"
    // Hadoop 3.4.3 would raise this to 10.x; Micronaut Security 3.x is built against 9.x
    implementation("com.nimbusds:nimbus-jose-jwt") {
        version { strictly "9.37.3" }
    }
    // Hadoop 3.4.3 brings Netty 4.1.127, whose HTTP compressor needs a newer zstd-jni than parquet provides
    implementation enforcedPlatform("io.netty:netty-bom:4.1.100.Final")
    runtimeOnly "io.micronaut:micronaut-management"

    // Delta reading
    implementation "io.delta:delta-standalone_2.12:3.1.0"
    implementation("org.apache.hadoop:hadoop-client:3.4.3") {
        exclude group: "org.slf4j"
    }
    implementation "org.apache.parquet:parquet-hadoop:1.13.1"
    implementation("org.apache.hadoop:hadoop-aws:3.3.6") {
        exclude group: "org.slf4j"
    }

    // Test Dependencies
    testImplementation "io.micronaut.test:micronaut-test-spock"
    testImplementation "io.micronaut:micronaut-http-client"
}

test {
    useJUnitPlatform()
}

tasks.named("dockerfile") {
    baseImage = "gcr.io/distroless/java11:latest"
    doLast {
        def dockerFile = file("${buildDir}/docker/main/Dockerfile")
        def content = dockerFile.text
        content = content.replaceAll("COPY layers/classes.*\n", "")
        dockerFile.text = content
    }
}

tasks.named("dockerBuild") {
    images = [getImage()]
}

def getImage() {
    def image = findProperty('IMAGE') ?: 'exacaster/delta-fetch'
    def tag = findProperty('TAG') ?: 'latest'
    return "${image}:${tag}"
}
